<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us!</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- NAVBAR -->
     <nav class="nav-bar">
        <ul id="nav-border">
            <li><a href="index.html">HOME</a></li>
            <li><a href="contact.html">CONTACT</a></li>
        </ul>
     </nav>
      <!-- HEADER -->
     <header>
        <div>
            <h1 class="animate-text">Contact Us!</h1>
        </div>
     </header>
     <style>
    @keyframes color-text {
      0% { color: #b5e1ff; }
      100% { color: #0a3f63; }
    }

    .animate-text {
      animation: color-text 4s;
    }
  </style>
     <!-- FORM -->
      <section>
        <div>
            <h3 id=""contact-h3">
                Please provide your contact information and a brief message of your inquiry.
            </h3>
            <br>
            <br>
            <h5 id=""contact-h3">
                Please fill the form out below.
            </h5>
            <div>
                <form>
                    <input type="text"  placeholder="First Name">
                    <input type="text" placeholder="Last Name"><br>
                    <input type="email"  placeholder="Email"><br>
                    <input type="tel" placeholder="Phone Number"><br>
                    <label>
                    Would you like to receive our monthly newsletter?
                    <input type="checkbox">
                    </label><br>
                    <br>
                    <textarea placeholder="Type message here..."></textarea>
                    </br>
                    <input class="form-submit" type="submit">
                </form>
            </div>
        </div>
      </section>
     <!-- FOOTER -->
     <footer>
        <table>
            <tr>
                <td>
                    <p>The Pet Shop! &copy;</p>
                </td>
                <td>
                    <p>123 Square Ave. Portland, OR 97204</p>
                </td>
                <td>
                    <p>503-234-3966</p>
                </td>
            </tr>
        </table>
    </footer>
</body>
</html>
