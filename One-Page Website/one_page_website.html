<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Flowers by Alisa</title>
    <link rel="stylesheet" href="./css/one-page-website.css">
    <link rel="stylesheet" href="bootstrap-5.3.2-dist/css/bootstrap.css">
  </head>
  <body>
    <script src="bootstrap-5.3.2-dist/js/bootstrap.js"></script>

    <!-- NAV -->
    <nav>
      <ul>
        <li><a href="#home" id="link">HOME</a></li>
        <li><a href="#gallery" id="link">GALLERY</a></li>
        <li><a href="#contact" id="link">CONTACT</a></li>
      </ul>
    </nav>
    <!-- END NAV -->

    <!-- HOME -->
    <section id="home">
      <h1>FLOWERS BY ALISA</h1>
      <p>Flower Arrangements for any occasion.</p>
    </section>
    <!-- END HOME -->

    <!-- GALLERY -->
    <section id="gallery">
      <h1>GALLERY</h1>

      <!-- VIDEO-CONTAINER 1 -->
      <div class="video-container">
        <iframe width="420" height="315"
          src="./Time-Lapse - Watch Flowers Bloom Before Your Eyes _ Short Film Showcase-LjCzPp-MK48.mp4">
        </iframe>
        <p>The wonder of flowers.</p>
      </div>
      <!-- END VIDEO-CONTAINER 1 -->

      <!-- PHOTO-CONTAINER 1 -->
      <div class="photo-container">
        <img src="./Images/Thumbs/flower_thumbnail_1.png" alt="DESERT SPRING Arrangement" width="300" height="320">
        <p>DESERT SPRING Arrangement.</p>
      </div>
      <!-- END PHOTO-CONTAINER 1 -->

      <!-- PHOTO-CONTAINER 2 -->
      <div class="photo-container">
        <img src="./Images/Thumbs/flower_thumbnail_2.png" alt="FLORAL SPRING Arrangement" width="300" height="350">
        <p>FLORAL SPRING Arrangement</p>
      </div>
      <!-- END PHOTO-CONTAINER 2 -->
    </section>
    <!-- END GALLERY -->

    <!-- CONTACT -->
    <section id="contact">
      <div class="contact-form">
        <form action="" method="get">
          First name: <input type="text" name="First_Name"><br>
          Last name: <input type="text" name="Last_Name"><br>
          Email: <input type="email" name="Email"><br>
          Message: <input type="text" name="Message"><br>
          <input type="submit" value="Submit">
        </form>
      </div>
    </section>
    <!-- END CONTACT -->

    <!-- FOOTER -->
    <footer class="footer">
      www.flowersbyAlisa.space &nbsp;| &nbsp; &copy; 2022
    </footer>
    <!-- END FOOTER -->
  </body>
</html>
